<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EarthScape Climate Agency — climate data you can trace back to a station</title>
    <meta
      name="description"
      content="EarthScape Climate Agency keeps a working record of station observations for Pakistan and its reference network, then turns them into maps, anomalies and short-range forecasts you can question."
    />
    <meta name="theme-color" content="#97471f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Applied before first paint so dark mode never flashes white.
      try {
        var stored = localStorage.getItem('earthscape.theme');
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (error) {
        /* storage unavailable — default light */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
