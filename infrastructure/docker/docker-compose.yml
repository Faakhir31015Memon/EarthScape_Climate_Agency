name: earthscape-climate-agency

# EarthScape Climate Agency - full stack: API, SPA, reverse proxy, MongoDB, pseudo-distributed
# HDFS + MapReduce, Spark master/worker, KRaft Kafka (no ZooKeeper), Redis, Airflow, Prometheus
# and Grafana.
#
#   cd infrastructure/docker
#   cp .env.example .env            # then fill every value marked "generate one"
#   docker compose --profile airflow --profile monitoring up -d --build
#
# Host paths are relative to this file, so the build contexts resolve to the repository
# root (`../..`) no matter where compose is invoked from.
#
# MongoDB is the only application database: the Django backend declares no ORM models and
# runs no migrations, so `mongodb-init` applies the index/validator migration instead.

x-backend-env: &backend-env
  MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-earthscape}:${MONGO_INITDB_ROOT_PASSWORD:?generate one in .env}@mongodb:27017/?authSource=admin
  MONGODB_DATABASE: ${MONGODB_DATABASE:-earthscape_climate}
  DATA_LAKE_ENGINE: ${DATA_LAKE_ENGINE:-webhdfs}
  DATA_LAKE_ROOT: /opt/earthscape/artifacts/datalake
  HDFS_WEBHDFS_URL: ${HDFS_WEBHDFS_URL:-http://hadoop-namenode:9870}
  HADOOP_USER: ${HADOOP_USER:-hadoop}
  HDFS_ROOT: ${HDFS_ROOT:-/earthscape}
  MAPREDUCE_MODE: ${MAPREDUCE_MODE:-cluster}
  HADOOP_HOME: ${HADOOP_HOME:-/opt/hadoop}
  HADOOP_STREAMING_JAR: ${HADOOP_STREAMING_JAR:-/opt/hadoop/share/hadoop/tools/lib/hadoop-streaming-3.3.6.jar}
  HADOOP_STREAMING_LOCAL_ROOT: ${HADOOP_STREAMING_LOCAL_ROOT:-/opt/earthscape/data-pipeline/mapreduce/streaming}
  SPARK_MASTER: ${SPARK_MASTER:-spark://spark-master:7077}
  SPARK_ENGINE_PREFER: ${SPARK_ENGINE_PREFER:-true}
  KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9094}
  KAFKA_CLIMATE_TOPIC: ${KAFKA_CLIMATE_TOPIC:-earthscape.climate.observations}
  KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-earthscape-processing}
  KAFKA_DEAD_LETTER_TOPIC: ${KAFKA_DEAD_LETTER_TOPIC:-earthscape.climate.deadletter}
  EVENT_STREAM_ENABLED: ${EVENT_STREAM_ENABLED:-false}
  POLLER_ENABLED: ${POLLER_ENABLED:-false}
  POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-900}
  CELERY_ENABLED: ${CELERY_ENABLED:-false}
  REDIS_URL: redis://redis:6379/0
  BACKGROUND_WORKERS: ${BACKGROUND_WORKERS:-4}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
  ARTIFACTS_ROOT: /opt/earthscape/artifacts
  REPORT_STORAGE_ROOT: /opt/earthscape/artifacts/reports
  MODEL_ARTIFACT_ROOT: /opt/earthscape/artifacts/models
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,nginx}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://nginx}

x-airflow-env: &airflow-env
  AIRFLOW_HOME: /opt/airflow
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_METADATA_USER:-airflow}:${AIRFLOW_METADATA_PASSWORD:?generate one in .env}@airflow-metadata:5432/${AIRFLOW_METADATA_DB:-airflow}
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?generate one in .env}
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
  AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
  AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
  EARTHSCAPE_API_BASE_URL: http://backend:8000/api/v1
  EARTHSCAPE_API_EMAIL: ${EARTHSCAPE_API_EMAIL:?provision a service account and set it in .env}
  EARTHSCAPE_API_PASSWORD: ${EARTHSCAPE_API_PASSWORD:?set in .env; never commit the value}
  BACKUP_SCRIPT: /opt/earthscape/backup/backup_mongodump.sh
  MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-earthscape}:${MONGO_INITDB_ROOT_PASSWORD:?generate one in .env}@mongodb:27017/?authSource=admin
  MONGODB_DATABASE: ${MONGODB_DATABASE:-earthscape_climate}

services:
  mongodb:
    image: mongo:7.0
    container_name: earthscape-mongodb
    command: ["--bind_ip_all", "--auth"]
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-earthscape}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?generate one in .env}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-earthscape_climate}
    ports:
      - "${MONGODB_PORT_BIND:-127.0.0.1}:27017:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s
    networks:
      - earthscape

  # Optional MongoDB browser. Enable with: docker compose --profile tools up -d mongo-express
  # mongo-express:
  #   image: mongo-express:1.0
  #   profiles: ["tools"]
  #   restart: unless-stopped
  #   environment:
  #     ME_CONFIG_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-earthscape}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
  #     ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
  #     ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}
  #   depends_on:
  #     mongodb:
  #       condition: service_healthy
  #   ports:
  #     - "127.0.0.1:8081:8081"
  #   healthcheck:
  #     test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/"]
  #     interval: 20s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 20s
  #   networks:
  #     - earthscape

  mongodb-init:
    image: earthscape/backend:local
    container_name: earthscape-mongodb-init
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *backend-env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?generate one in .env}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?generate one in .env}
    volumes:
      - ../..:/repo:ro
    # Idempotent: creates every collection, index and validator in scripts/migrate_mongo.py.
    entrypoint: ["/bin/sh", "-c"]
    command: ["python /repo/scripts/migrate_mongo.py && echo 'mongodb collections and indexes ready'"]
    networks:
      - earthscape

  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.backend
      args:
        INSTALL_JDK: ${SPARK_INSTALL_JDK:-true}
    image: earthscape/backend:local
    container_name: earthscape-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *backend-env
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?generate one in .env}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?generate one in .env}
      BACKEND_BASE_URL: http://backend:8000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8000"
    ports:
      - "${BACKEND_PORT_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - earthscape-artifacts:/opt/earthscape/artifacts
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:8000/api/v1/health"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 45s
    networks:
      - earthscape

  frontend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_MAP_TILES_URL: ${VITE_MAP_TILES_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
        VITE_MAP_ATTRIBUTION: ${VITE_MAP_ATTRIBUTION:-OpenStreetMap contributors}
        VITE_POLLING_INTERVAL_MS: ${VITE_POLLING_INTERVAL_MS:-30000}
    image: earthscape/frontend:local
    container_name: earthscape-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - earthscape

  nginx:
    image: nginx:1.27-alpine
    container_name: earthscape-nginx
    restart: unless-stopped
    volumes:
      - ../nginx/earthscape.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_FILE:-./nginx/certs/earthscape.crt}:/etc/nginx/tls/earthscape.crt:ro
      - ${TLS_KEY_FILE:-./nginx/certs/earthscape.key}:/etc/nginx/tls/earthscape.key:ro
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - earthscape

  redis:
    image: redis:7.2-alpine
    container_name: earthscape-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - earthscape

  hadoop-namenode:
    image: apache/hadoop:3.3.6
    container_name: earthscape-hadoop-namenode
    restart: unless-stopped
    hostname: hadoop-namenode
    environment:
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HADOOP_OPTS: ${HADOOP_OPTS:--Xmx1g}
      HDFS_NAMENODE_USER: hadoop
      HDFS_DATANODE_USER: hadoop
      HDFS_SECONDARYNAMENODE_USER: hadoop
      YARN_RESOURCEMANAGER_USER: hadoop
      YARN_NODEMANAGER_USER: hadoop
    command:
      - bash
      - -c
      - >-
        if [ ! -f /hadoop/hdfs/name/current/VERSION ]; then hdfs namenode -format -force -nonInteractive; fi;
        hdfs --daemon start namenode;
        while ! curl -sf "http://127.0.0.1:9870/webhdfs/v1/?op=GETFILESTATUS&user.name=hadoop" >/dev/null; do sleep 2; done;
        for layer in raw validated processed analytics ml-features exports; do
        hadoop fs -mkdir -p "${HDFS_ROOT:-/earthscape}/datalake/$${layer}";
        done;
        hadoop fs -chmod -R 777 "${HDFS_ROOT:-/earthscape}";
        hadoop fs -ls -R "${HDFS_ROOT:-/earthscape}" || true;
        exec tail -F /opt/hadoop/logs/hadoop-*-namenode-*.log
    ports:
      - "${HDFS_RPC_PORT:-9000}:9000"
      - "${WEBHDFS_PORT:-9870}:9870"
    volumes:
      - hdfs-name:/hadoop/hdfs/name
      - hadoop-site:/opt/hadoop/etc/hadoop
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 5 'http://127.0.0.1:9870/webhdfs/v1/?op=GETFILESTATUS&user.name=hadoop' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - earthscape

  hadoop-datanode:
    image: apache/hadoop:3.3.6
    container_name: earthscape-hadoop-datanode
    restart: unless-stopped
    hostname: hadoop-datanode
    environment:
      HADOOP_HOME: /opt/hadoop
      HADOOP_OPTS: ${HADOOP_OPTS:--Xmx1g}
      FS_DEFAULT_FS: hdfs://hadoop-namenode:9000
      DFS_REPLICATION: "1"
      HDFS_DATANODE_USER: hadoop
    command: ["hdfs", "datanode"]
    ports:
      - "${HDFS_DATANODE_UI_PORT:-9864}:9864"
    volumes:
      - hdfs-data:/hadoop/hdfs/data
      - hadoop-site:/opt/hadoop/etc/hadoop:ro
    depends_on:
      hadoop-namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 5 http://127.0.0.1:9864/ || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - earthscape

  hadoop-resourcemanager:
    image: apache/hadoop:3.3.6
    container_name: earthscape-hadoop-resourcemanager
    restart: unless-stopped
    hostname: hadoop-resourcemanager
    environment:
      HADOOP_HOME: /opt/hadoop
      HADOOP_OPTS: ${HADOOP_OPTS:--Xmx1g}
      YARN_RESOURCEMANAGER_USER: hadoop
      YARN_NODEMANAGER_USER: hadoop
      MAPREDUCE_JOBTRACKERADDRESS: hadoop-resourcemanager:8032
    command: ["yarn", "resourcemanager"]
    ports:
      - "${YARN_RM_PORT:-8088}:8088"
    volumes:
      - yarn-rm:/hadoop/yarn
      - hadoop-site:/opt/hadoop/etc/hadoop:ro
    depends_on:
      hadoop-namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 5 http://127.0.0.1:8088/ws/v1/cluster/info || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - earthscape

  hadoop-nodemanager:
    image: apache/hadoop:3.3.6
    container_name: earthscape-hadoop-nodemanager
    restart: unless-stopped
    hostname: hadoop-nodemanager
    environment:
      HADOOP_HOME: /opt/hadoop
      HADOOP_OPTS: ${HADOOP_OPTS:--Xmx1g}
      YARN_RESOURCEMANAGER_HOSTNAME: hadoop-resourcemanager
      YARN_NODEMANAGER_VPCHOSTNAME: hadoop-nodemanager
      YARN_NODEMANAGER_USER: hadoop
      # MapReduce Streaming launches `python3 <mapper>`; the image must have a matching
      # interpreter and read access to the pipeline sources mounted below.
      PYTHON_BIN: python3
    command: ["yarn", "nodemanager"]
    ports:
      - "${YARN_NM_PORT:-8042}:8042"
    volumes:
      - yarn-nm:/hadoop/yarn
      - hadoop-site:/opt/hadoop/etc/hadoop:ro
      - ../..:/repo:ro
    depends_on:
      hadoop-resourcemanager:
        condition: service_healthy
      hadoop-datanode:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 5 http://127.0.0.1:8042/ws/v1/node/info || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - earthscape

  hadoop-history-server:
    image: apache/hadoop:3.3.6
    container_name: earthscape-hadoop-history
    restart: unless-stopped
    hostname: hadoop-history-server
    environment:
      HADOOP_HOME: /opt/hadoop
      HADOOP_OPTS: ${HADOOP_OPTS:--Xmx1g}
      YARN_HISTORYSERVER_ADDRESS: hadoop-history-server:10020
      MAPREDUCE_JOBHISTORY_ADDRESS: hadoop-history-server:10020
      MAPREDUCE_JOBHISTORY_LOGDIR: hdfs://hadoop-namenode:9000${HDFS_ROOT:-/earthscape}/mapred/history/done
    command: ["mapred", "historyserver"]
    ports:
      - "${MR_HISTORY_PORT:-19888}:19888"
    volumes:
      - hadoop-site:/opt/hadoop/etc/hadoop:ro
    depends_on:
      hadoop-namenode:
        condition: service_healthy
      hadoop-resourcemanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 5 http://127.0.0.1:19888/ws/v1/history/cluster/scheduler || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 60s
    networks:
      - earthscape

  spark-master:
    image: apache/spark:3.5.1
    container_name: earthscape-spark-master
    restart: unless-stopped
    hostname: spark-master
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
                 "--host", "spark-master", "--port", "7077", "--web", "8080"]
    environment:
      SPARK_MASTER_WEBUI_PORT: "8080"
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "${SPARK_MASTER_UI_PORT:-6066}:8080"
      - "${SPARK_MASTER_PORT:-7077}:7077"
    depends_on:
      hadoop-namenode:
        condition: service_healthy
    # The Spark image ships no curl, so the probe uses bash's own /dev/tcp redirect.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'timeout 3 bash -c \"echo > /dev/tcp/127.0.0.1/8080\"' || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 8
      start_period: 30s
    networks:
      - earthscape

  spark-worker:
    image: apache/spark:3.5.1
    container_name: earthscape-spark-worker
    restart: unless-stopped
    hostname: spark-worker
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
                 "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_WEBUI_PORT: "8081"
      SPARK_WORKER_DIR: /tmp/spark-work
      SPARK_NO_DAEMONIZE: "true"
      PYSPARK_PYTHON: /usr/bin/python3
    ports:
      - "${SPARK_WORKER_UI_PORT:-6067}:8081"
    volumes:
      # Drivers submit from the repository working copy, so workers need the same paths.
      - ../..:/repo:ro
      - spark-work:/tmp/spark-work
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'timeout 3 bash -c \"echo > /dev/tcp/127.0.0.1/8081\"' || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 8
      start_period: 30s
    networks:
      - earthscape

  spark-job-server:
    image: apache/spark:3.5.1
    container_name: earthscape-spark-job-server
    restart: unless-stopped
    # Standing submit client: `docker exec -it earthscape-spark-job-server bash` and run any
    # infrastructure/spark/submit-*.sh exactly as written.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        while :; do
        /opt/spark/bin/spark-submit --version >/dev/null 2>&1 || exit 1;
        sleep 60;
        done
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_HOME: /opt/spark
      PYTHONPATH: /repo/data-pipeline
      PYSPARK_PYTHON: /usr/bin/python3
    volumes:
      - ../..:/repo:ro
      - earthscape-artifacts:/opt/earthscape/artifacts
      - spark-jobs:/tmp/spark-jobs
    depends_on:
      spark-master:
        condition: service_healthy
      hadoop-namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/opt/spark/bin/spark-submit --version >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 30s
    networks:
      - earthscape

  kafka:
    image: apache/kafka:3.7.1
    container_name: earthscape-kafka
    # KRaft mode: the same process is broker and controller, so no ZooKeeper is deployed.
    restart: unless-stopped
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_ADVERTISED_HOST:-localhost}:9092,INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-168}
      KAFKA_NUM_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION:-1}
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?generate one with kafka-storage.sh random-uuid}
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094 >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 20s
      retries: 10
      start_period: 40s
    networks:
      - earthscape

  kafka-init:
    image: apache/kafka:3.7.1
    container_name: earthscape-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ../kafka:/opt/earthscape/kafka:ro
    entrypoint: ["/bin/sh", "/opt/earthscape/kafka/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      KAFKA_CLIMATE_TOPIC: ${KAFKA_CLIMATE_TOPIC:-earthscape.climate.observations}
      KAFKA_DEAD_LETTER_TOPIC: ${KAFKA_DEAD_LETTER_TOPIC:-earthscape.climate.deadletter}
      KAFKA_INGEST_EVENTS_TOPIC: ${KAFKA_INGEST_EVENTS_TOPIC:-earthscape.ingest.events}
      KAFKA_ALERT_EVENTS_TOPIC: ${KAFKA_ALERT_EVENTS_TOPIC:-earthscape.alert.events}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_TOPIC_REPLICATION: ${KAFKA_TOPIC_REPLICATION:-1}
      KAFKA_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-168}
    networks:
      - earthscape

  airflow-metadata:
    image: postgres:15-alpine
    container_name: earthscape-airflow-db
    restart: unless-stopped
    profiles: ["airflow", "monitoring"]
    environment:
      POSTGRES_DB: ${AIRFLOW_METADATA_DB:-airflow}
      POSTGRES_USER: ${AIRFLOW_METADATA_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_METADATA_PASSWORD:?generate one in .env}
    volumes:
      - airflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_METADATA_USER:-airflow} -d ${AIRFLOW_METADATA_DB:-airflow}"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - earthscape

  airflow-init:
    image: apache/airflow:2.7.3-python3.10
    container_name: earthscape-airflow-init
    restart: "no"
    profiles: ["airflow", "monitoring"]
    env_file:
      - .env
    environment:
      <<: *airflow-env
    entrypoint: ["/usr/bin/dumb-init", "--"]
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        airflow connections list >/dev/null 2>&1 || true;
        airflow users list | grep -q "${AIRFLOW_ADMIN_EMAIL:-ops@earthscape.local}" ||
        airflow users create --username "${AIRFLOW_ADMIN_USER:-earthscape}"
        --password "${AIRFLOW_ADMIN_PASSWORD:?generate one in .env}"
        --firstname EarthScape --lastname Operator --role Admin
        --email "${AIRFLOW_ADMIN_EMAIL:-ops@earthscape.local}"
    volumes:
      - airflow-logs:/opt/airflow/logs
    depends_on:
      airflow-metadata:
        condition: service_healthy
    networks:
      - earthscape

  airflow-webserver:
    image: apache/airflow:2.7.3-python3.10
    container_name: earthscape-airflow-webserver
    restart: unless-stopped
    profiles: ["airflow", "monitoring"]
    env_file:
      - .env
    environment:
      <<: *airflow-env
    entrypoint: ["/usr/bin/dumb-init", "--", "/entrypoint.sh"]
    command: ["webserver"]
    ports:
      - "${AIRFLOW_WEB_PORT:-8090}:8080"
    volumes:
      - ../airflow/dags:/opt/airflow/dags:ro
      - airflow-logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 5 http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 90s
    networks:
      - earthscape

  airflow-scheduler:
    image: apache/airflow:2.7.3-python3.10
    container_name: earthscape-airflow-scheduler
    restart: unless-stopped
    profiles: ["airflow", "monitoring"]
    env_file:
      - .env
    environment:
      <<: *airflow-env
    entrypoint: ["/usr/bin/dumb-init", "--", "/entrypoint.sh"]
    command: ["scheduler"]
    volumes:
      # Host path resolves to infrastructure/airflow/dags, where this repo keeps the DAGs.
      - ../airflow/dags:/opt/airflow/dags:ro
      - ../monitoring/backup:/opt/earthscape/backup:ro
      - earthscape-artifacts:/opt/earthscape/artifacts
      - airflow-logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\" || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 8
      start_period: 90s
    networks:
      - earthscape

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: earthscape-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    depends_on:
      backend:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - earthscape

  grafana:
    image: grafana/grafana:11.1.0
    container_name: earthscape-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?generate one in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - earthscape

networks:
  earthscape:
    driver: bridge

volumes:
  mongodb-data:
  mongodb-config:
  earthscape-artifacts:
  redis-data:
  hdfs-name:
  hdfs-data:
  hadoop-site:
  yarn-rm:
  yarn-nm:
  spark-work:
  spark-jobs:
  kafka-data:
  airflow-postgres:
  airflow-logs:
  prometheus-data:
  grafana-data:
