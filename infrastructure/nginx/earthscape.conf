# EarthScape Climate Agency — reverse proxy in front of the SPA and the REST API.
# The browser talks only to this origin; it never reaches MongoDB Atlas directly.

upstream earthscape_backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are validated server-side as well; this only stops needless backend load.
    client_max_body_size 64m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # API + API documentation, proxied to Django.
    location /api/ {
        proxy_pass http://earthscape_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Stored files (uploads, report artefacts, model artifacts) are served only through
    # the authenticated /api/v1/... download endpoints above; there is no /media/ route
    # in Django and none is exposed here on purpose.

    # Hashed build assets can be cached hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router owns client-side routes: serve the shell, let the app resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
