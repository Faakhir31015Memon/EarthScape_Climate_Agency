# EarthScape Climate Agency - reverse proxy in front of the API and the built SPA.
#
# Mounted by the nginx service as /etc/nginx/conf.d/default.conf (see docker-compose.yml).
# Ports are published on the host as 8080 (http) and 8443 (https); the 443 listener needs a
# certificate pair at /etc/nginx/tls/ because TLS_CERT_FILE / TLS_KEY_FILE bind-mount them.
#
# Deliberately no `server_tokens`, no upstream identifiers in error pages, and no proxying of
# /admin or /api/token outside the API so nothing extra is exposed.

upstream earthscape_backend {
    server backend:8000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

upstream earthscape_frontend {
    server frontend:80 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

# Health endpoints answer 200/503 from the application; they must never be cached or retried
# through a stale connection, so proxy_cache is off and the read timeout is short.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # X-Accel and version banners are removed below; this line keeps the Server header itself
    # from naming the nginx build.
    server_tokens off;

    access_log /var/log/nginx/earthscape.access.log combined;
    error_log /var/log/nginx/earthscape.error.log warn;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------- body size
    # 50 MB must equal MAX_UPLOAD_BYTES in infrastructure/docker/.env.example: a bulk CSV or
    # NetCDF upload has to pass the proxy before the API's own validator can judge it. If the
    # two disagree, the client sees a bare 413 from nginx instead of the API's structured error.
    client_max_body_size 50m;
    client_body_buffer_size 1m;
    client_body_timeout 120s;
    client_header_timeout 30s;
    large_client_header_buffers 4 16k;
    keepalive_timeout 65;

    # ------------------------------------------------------------------ gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # -------------------------------------------------------- security headers
    # default-src 'self' keeps the SPA from executing anything fetched from another origin;
    # map tiles are images from the tile host configured in VITE_MAP_TILES_URL, and data: URIs
    # are needed by inline SVG layers. style-unsafe-inline is required by the leaflet inline
    # styles; script stays strict so an injected <script> cannot run.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Stock nginx has no headers-more module, so upstream identities are removed with
    # proxy_hide_header plus server_tokens off; nothing here claims to erase the Server header.
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Backend-Server;

    # ------------------------------------------------------------------- API
    location /api/ {
        proxy_pass http://earthscape_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The API reads only these two forwarded headers, and only when
        # BEHIND_PROXY is true; the client cannot set them.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        # Long-running CSV/NetCDF parses and report generation answer inside this window; a
        # background job is polled instead of holding the connection open.
        proxy_read_timeout 180s;
        proxy_buffering off;
        # 4xx/5xx from the API are returned verbatim: Django renders them as the JSON error
        # envelope, and an nginx error page would hide the detail.
        proxy_intercept_errors off;
    }

    # ------------------------------------------------------------- liveness for LB
    # /api/v1/health and /api/v1/ready are the application's own probes and are already proxied
    # by /api/; this path only proves nginx itself is serving.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "nginx ok\n";
    }

    # Reports and exports are streamed by the API under /api/v1 (permission checks stay there),
    # so there is no /media/ or /static/ location: Django serves no media in this project.

    # -------------------------------------------------------- SPA static shell
    location / {
        proxy_pass http://earthscape_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Hashed Vite assets are immutable; index.html must revalidate so a new deploy is immediate.
    # Only `expires` is used here: add_header inside a location would stop nginx inheriting the
    # server-level security headers, so the CSP/nosniff block would silently disappear on assets.
    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|webp|avif|map)$ {
        proxy_pass http://earthscape_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 30d;
        access_log off;
    }

    location = /favicon.ico {
        proxy_pass http://earthscape_frontend;
        access_log off;
        log_not_found off;
    }

    # Nothing else is exposed: the API's own router returns 404 for unknown prefixes, and these
    # blocks only stop the proxy from forwarding probes at paths this project does not serve.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        return 404;
    }
}

# HTTPS is identical apart from the listener and the certificate pair; compose mounts them at
# /etc/nginx/tls, and the 8443 host port maps to this 443 listener.
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/nginx/tls/earthscape.crt;
    ssl_certificate_key /etc/nginx/tls/earthscape.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:EarthScapeTLS:10m;
    ssl_session_timeout 1d;
    ssl_stapling off;

    access_log /var/log/nginx/earthscape.tls.access.log combined;
    error_log /var/log/nginx/earthscape.tls.error.log warn;

    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml text/plain;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
    proxy_hide_header X-Powered-By;

    location /api/ {
        proxy_pass http://earthscape_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_buffering off;
        proxy_intercept_errors off;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "nginx ok\n";
    }

    location / {
        proxy_pass http://earthscape_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        return 404;
    }
}
