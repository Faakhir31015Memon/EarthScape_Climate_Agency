# Static serving rules for the built SPA (the serve stage of Dockerfile.frontend copies this
# file to /etc/nginx/conf.d/default.conf).
#
# The reverse proxy (infrastructure/nginx/earthscape.conf) fronts this container in compose, so
# the API is reached through the proxy: this server only ever answers for the application shell
# and its hashed assets. The health check in the image pings /healthz, which is why that path is
# answered here instead of falling through to the SPA router.

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # index.html is never cached so a new deploy is visible immediately; assets carry a content
    # hash and are immutable, so they keep a long max-age set with `expires` (add_header in a
    # location would break inheritance of the server-level security headers below).
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
    }

    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|webp|avif|map)$ {
        expires 30d;
        try_files $uri =404;
        access_log off;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "frontend ok\n";
    }

    # Browser-side routing: any unknown path returns the shell, and the SPA decides. Only the
    # proxy (see earthscape.conf) ever forwards /api/ here, so a genuine miss must not be turned
    # into index.html with HTTP 200 - that would hide the API's own 404 from operators.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        return 404;
    }
}
