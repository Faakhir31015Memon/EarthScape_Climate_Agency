openapi: 3.0.3
info:
  title: EarthScape Climate Agency API
  version: 1.0.0
  description: Big Data climate intelligence, analytics and prediction platform. MongoDB
    Atlas is the primary application database; Hadoop/Spark provide distributed processing;
    scikit-learn/XGBoost provide forecasts.
